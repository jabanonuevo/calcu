<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #1E3A5F;
    --color-on-primary: #FFFFFF;
    --color-secondary: #2563EB;
    --color-accent: #059669;
    --color-background: #F8FAFC;
    --color-foreground: #0F172A;
    --color-muted: #F1F3F5;
    --color-border: #E4E7EB;
    --color-destructive: #DC2626;
    --color-ring: #1E3A5F;
    --clay-shadow: 6px 6px 14px rgba(15, 23, 42, 0.12), -6px -6px 14px rgba(255, 255, 255, 0.7);
    --clay-shadow-pressed: inset 4px 4px 8px rgba(15, 23, 42, 0.15), inset -4px -4px 8px rgba(255, 255, 255, 0.6);
  }

  :root[data-theme="dark"] {
    --color-background: #0F172A;
    --color-foreground: #F1F5F9;
    --color-muted: #1E293B;
    --color-border: #334155;
    --clay-shadow: 6px 6px 14px rgba(0, 0, 0, 0.45), -6px -6px 14px rgba(51, 65, 85, 0.35);
    --clay-shadow-pressed: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -4px -4px 8px rgba(51, 65, 85, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background: #0F172A;
      --color-foreground: #F1F5F9;
      --color-muted: #1E293B;
      --color-border: #334155;
      --clay-shadow: 6px 6px 14px rgba(0, 0, 0, 0.45), -6px -6px 14px rgba(51, 65, 85, 0.35);
      --clay-shadow-pressed: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -4px -4px 8px rgba(51, 65, 85, 0.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    background: var(--color-background);
    font-family: 'Nunito', sans-serif;
    color: var(--color-foreground);
    transition: background 0.3s ease, color 0.3s ease;
  }

  .card {
    position: relative;
    width: 320px;
    max-width: 100%;
    background: var(--color-background);
    border: 3px solid var(--color-border);
    border-radius: 28px;
    padding: 24px;
    box-shadow: var(--clay-shadow);
  }

  .card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card__title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
  }

  .theme-toggle {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-muted);
    border: 2px solid var(--color-border);
    border-radius: 14px;
    cursor: pointer;
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow);
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle:active { box-shadow: var(--clay-shadow-pressed); transform: scale(0.95); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

  .history {
    min-height: 20px;
    text-align: right;
    font-size: 13px;
    color: var(--color-foreground);
    opacity: 0.55;
    padding: 0 6px;
    font-family: 'Nunito', sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #display {
    width: 100%;
    background: var(--color-muted);
    border: 3px solid var(--color-border);
    border-radius: 18px;
    box-shadow: var(--clay-shadow-pressed);
    color: var(--color-foreground);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 34px;
    text-align: right;
    padding: 14px 18px;
    margin: 6px 0 18px;
    letter-spacing: 0.5px;
  }

  #display.pop {
    animation: pop 220ms ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.94); }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button.key {
    height: 58px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 19px;
    border: 3px solid var(--color-border);
    border-radius: 18px;
    cursor: pointer;
    background: var(--color-muted);
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow);
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.key:hover { transform: translateY(-2px); }
  button.key:active {
    transform: scale(0.95);
    box-shadow: var(--clay-shadow-pressed);
  }
  button.key:focus-visible {
    outline: 3px solid var(--color-ring);
    outline-offset: 2px;
  }

  button.key svg { width: 20px; height: 20px; }

  button.operator {
    background: var(--color-secondary);
    color: var(--color-on-primary);
    border-color: var(--color-secondary);
  }
  button.equals {
    background: var(--color-accent);
    color: var(--color-on-primary);
    border-color: var(--color-accent);
    grid-column: span 2;
  }
  button.clear {
    background: var(--color-destructive);
    color: var(--color-on-primary);
    border-color: var(--color-destructive);
  }

  @media (prefers-reduced-motion: reduce) {
    button.key, .theme-toggle, #display.pop {
      transition: none;
      animation: none;
    }
    button.key:hover, .theme-toggle:hover { transform: none; }
  }

  @media (max-width: 380px) {
    .card { width: 100%; padding: 18px; }
    #display { font-size: 28px; }
    button.key { height: 52px; font-size: 17px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card__header">
    <p class="card__title">Calculator</p>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
  </div>

  <div class="history" id="history">&nbsp;</div>
  <input type="text" id="display" disabled aria-label="Calculator display" value="0">

  <div class="buttons">
    <button class="key clear" onclick="clearDisplay()" aria-label="Clear">C</button>
    <button class="key" onclick="deleteLast()" aria-label="Backspace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a1 1 0 001-1V5a1 1 0 00-1-1z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
    </button>
    <button class="key operator" onclick="appendValue('%')" aria-label="Percent">%</button>
    <button class="key operator" onclick="appendValue('/')" aria-label="Divide">÷</button>

    <button class="key" onclick="appendValue('7')">7</button>
    <button class="key" onclick="appendValue('8')">8</button>
    <button class="key" onclick="appendValue('9')">9</button>
    <button class="key operator" onclick="appendValue('*')" aria-label="Multiply">×</button>

    <button class="key" onclick="appendValue('4')">4</button>
    <button class="key" onclick="appendValue('5')">5</button>
    <button class="key" onclick="appendValue('6')">6</button>
    <button class="key operator" onclick="appendValue('-')" aria-label="Subtract">−</button>

    <button class="key" onclick="appendValue('1')">1</button>
    <button class="key" onclick="appendValue('2')">2</button>
    <button class="key" onclick="appendValue('3')">3</button>
    <button class="key operator" onclick="appendValue('+')" aria-label="Add">+</button>

    <button class="key" onclick="appendValue('0')">0</button>
    <button class="key" onclick="appendValue('.')">.</button>
    <button class="key equals" onclick="calculate()" aria-label="Equals">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  const history = document.getElementById('history');
  const themeToggle = document.getElementById('themeToggle');

  const storedTheme = localStorage.getItem('calc-theme');
  if (storedTheme) {
    document.documentElement.setAttribute('data-theme', storedTheme);
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('calc-theme', next);
  });

  function appendValue(value) {
    if (display.value === '0' && /[0-9]/.test(value)) {
      display.value = value;
    } else if (display.value === 'Error') {
      display.value = value;
    } else {
      display.value += value;
    }
  }

  function clearDisplay() {
    display.value = '0';
    history.innerHTML = '&nbsp;';
  }

  function deleteLast() {
    display.value = display.value.slice(0, -1) || '0';
  }

  function calculate() {
    const expression = display.value;
    try {
      const result = Function('"use strict"; return (' + expression + ')')();
      history.textContent = expression + ' =';
      display.value = Number.isFinite(result) ? String(result) : 'Error';
    } catch {
      display.value = 'Error';
    }
    display.classList.remove('pop');
    void display.offsetWidth;
    display.classList.add('pop');
  }

  document.addEventListener('keydown', (e) => {
    if (/[0-9+\-*/.%]/.test(e.key)) {
      appendValue(e.key);
    } else if (e.key === 'Enter' || e.key === '=') {
      e.preventDefault();
      calculate();
    } else if (e.key === 'Backspace') {
      deleteLast();
    } else if (e.key === 'Escape') {
      clearDisplay();
    }
  });
</script>

</body>
</html>
