<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun Hub — Calculator &amp; Offline Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #1E3A5F;
    --color-on-primary: #FFFFFF;
    --color-secondary: #2563EB;
    --color-accent: #059669;
    --color-background: #F8FAFC;
    --color-foreground: #0F172A;
    --color-muted: #F1F3F5;
    --color-border: #E4E7EB;
    --color-destructive: #DC2626;
    --color-ring: #1E3A5F;
    --accent-purple: #7C3AED;
    --accent-orange: #EA580C;
    --accent-pink: #DB2777;
    --accent-teal: #0D9488;
    --clay-shadow: 6px 6px 14px rgba(15, 23, 42, 0.12), -6px -6px 14px rgba(255, 255, 255, 0.7);
    --clay-shadow-pressed: inset 4px 4px 8px rgba(15, 23, 42, 0.15), inset -4px -4px 8px rgba(255, 255, 255, 0.6);
    --clay-shadow-sm: 3px 3px 8px rgba(15, 23, 42, 0.12), -3px -3px 8px rgba(255, 255, 255, 0.7);
  }

  :root[data-theme="dark"] {
    --color-background: #0F172A;
    --color-foreground: #F1F5F9;
    --color-muted: #1E293B;
    --color-border: #334155;
    --clay-shadow: 6px 6px 14px rgba(0, 0, 0, 0.45), -6px -6px 14px rgba(51, 65, 85, 0.35);
    --clay-shadow-pressed: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -4px -4px 8px rgba(51, 65, 85, 0.25);
    --clay-shadow-sm: 3px 3px 8px rgba(0, 0, 0, 0.45), -3px -3px 8px rgba(51, 65, 85, 0.3);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-background: #0F172A;
      --color-foreground: #F1F5F9;
      --color-muted: #1E293B;
      --color-border: #334155;
      --clay-shadow: 6px 6px 14px rgba(0, 0, 0, 0.45), -6px -6px 14px rgba(51, 65, 85, 0.35);
      --clay-shadow-pressed: inset 4px 4px 8px rgba(0, 0, 0, 0.5), inset -4px -4px 8px rgba(51, 65, 85, 0.25);
      --clay-shadow-sm: 3px 3px 8px rgba(0, 0, 0, 0.45), -3px -3px 8px rgba(51, 65, 85, 0.3);
    }
  }

  * { box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    background: var(--color-background);
    font-family: 'Nunito', sans-serif;
    color: var(--color-foreground);
    transition: background 0.3s ease, color 0.3s ease;
  }

  html { scroll-behavior: smooth; }

  .app {
    width: 100%;
    max-width: 1400px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .header-sticky {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--color-background);
    padding: 20px 0 4px;
    margin: -20px 0 4px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
  }
  .brand .logo { font-size: 26px; }

  .icon-btn {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-muted);
    border: 2px solid var(--color-border);
    border-radius: 14px;
    cursor: pointer;
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow-sm);
    font-size: 18px;
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
    flex: none;
  }
  .icon-btn:hover { transform: translateY(-1px); }
  .icon-btn:active { box-shadow: var(--clay-shadow-pressed); transform: scale(0.95); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .icon-moon, .icon-btn .icon-muted { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-btn .icon-moon { display: block; }
  .icon-btn[data-muted="true"] .icon-loud { display: none; }
  .icon-btn[data-muted="true"] .icon-muted { display: inline; }

  .controls { display: flex; gap: 10px; margin-left: auto; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: thin;
  }
  .tab {
    flex: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
    border: 2px solid var(--color-border);
    border-radius: 14px;
    background: var(--color-muted);
    color: var(--color-foreground);
    cursor: pointer;
    box-shadow: var(--clay-shadow-sm);
    transition: transform 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
    white-space: nowrap;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab.active {
    background: var(--color-primary);
    color: var(--color-on-primary);
    border-color: var(--color-primary);
  }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    align-items: start;
    gap: 24px;
  }
  .tabpanel { animation: fadein 300ms ease-out; scroll-margin-top: 136px; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  /* ---------- Shared card ---------- */
  .card {
    position: relative;
    background: var(--color-background);
    border: 3px solid var(--color-border);
    border-radius: 28px;
    padding: 22px;
    box-shadow: var(--clay-shadow);
    max-width: 380px;
    margin: 0 auto;
  }
  .card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .card__title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .card__sub {
    font-size: 13px;
    opacity: 0.65;
    margin: -8px 0 14px;
    text-align: center;
  }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .pill {
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    border: 2px solid var(--color-border);
    background: var(--color-muted);
    cursor: pointer;
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow-sm);
    transition: transform 120ms ease-out, background 120ms ease-out;
  }
  .pill:hover { transform: translateY(-1px); }
  .pill.active { background: var(--color-secondary); color: var(--color-on-primary); border-color: var(--color-secondary); }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 14px;
    opacity: 0.85;
  }
  .scoreboard b { display: block; font-size: 18px; font-family: 'Fredoka', sans-serif; }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 14px;
    border: 3px solid var(--color-secondary);
    background: var(--color-secondary);
    color: var(--color-on-primary);
    cursor: pointer;
    box-shadow: var(--clay-shadow-sm);
    transition: transform 150ms ease-out;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(0.96); }
  .btn.ghost { background: var(--color-muted); color: var(--color-foreground); border-color: var(--color-border); }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

  .status-line {
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 16px;
    min-height: 24px;
    margin-bottom: 10px;
  }

  /* ---------- Calculator ---------- */
  .history {
    min-height: 20px;
    text-align: right;
    font-size: 13px;
    color: var(--color-foreground);
    opacity: 0.55;
    padding: 0 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #display {
    width: 100%;
    background: var(--color-muted);
    border: 3px solid var(--color-border);
    border-radius: 18px;
    box-shadow: var(--clay-shadow-pressed);
    color: var(--color-foreground);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 34px;
    text-align: right;
    padding: 14px 18px;
    margin: 6px 0 18px;
    letter-spacing: 0.5px;
  }
  #display.pop { animation: pop 220ms ease-out; }
  @keyframes pop {
    0% { transform: scale(0.94); }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button.key {
    height: 56px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 19px;
    border: 3px solid var(--color-border);
    border-radius: 18px;
    cursor: pointer;
    background: var(--color-muted);
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow);
    transition: transform 150ms ease-out, box-shadow 150ms ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.key:hover { transform: translateY(-2px); }
  button.key:active { transform: scale(0.95); box-shadow: var(--clay-shadow-pressed); }
  button.key svg { width: 20px; height: 20px; }
  button.operator { background: var(--color-secondary); color: var(--color-on-primary); border-color: var(--color-secondary); }
  button.equals { background: var(--color-accent); color: var(--color-on-primary); border-color: var(--color-accent); grid-column: span 2; }
  button.clear { background: var(--color-destructive); color: var(--color-on-primary); border-color: var(--color-destructive); }

  /* ---------- Tic Tac Toe ---------- */
  .ttt-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 280px;
    margin: 0 auto 14px;
  }
  .ttt-cell {
    aspect-ratio: 1;
    background: var(--color-muted);
    border: 3px solid var(--color-border);
    border-radius: 16px;
    box-shadow: var(--clay-shadow-sm);
    font-family: 'Fredoka', sans-serif;
    font-size: 34px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-purple);
    transition: transform 120ms ease-out;
  }
  .ttt-cell:hover:not(:disabled) { transform: translateY(-2px); }
  .ttt-cell[data-v="O"] { color: var(--accent-orange); }

  /* ---------- Snake ---------- */
  .snake-wrap { display: flex; flex-direction: column; align-items: center; }
  #snakeCanvas {
    background: var(--color-muted);
    border: 3px solid var(--color-border);
    border-radius: 16px;
    box-shadow: var(--clay-shadow-pressed);
    touch-action: none;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; margin-top: 14px; }
  .dpad button {
    border-radius: 12px;
    border: 2px solid var(--color-border);
    background: var(--color-muted);
    box-shadow: var(--clay-shadow-sm);
    cursor: pointer;
    font-size: 18px;
    color: var(--color-foreground);
  }
  .dpad button:active { box-shadow: var(--clay-shadow-pressed); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  /* ---------- 2048 ---------- */
  .g2048-board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    background: var(--color-muted);
    border: 3px solid var(--color-border);
    border-radius: 16px;
    padding: 10px;
    width: 280px;
    height: 280px;
    margin: 0 auto;
    box-shadow: var(--clay-shadow-pressed);
  }
  .g2048-tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
    background: var(--color-background);
    color: var(--color-foreground);
    box-shadow: var(--clay-shadow-sm);
    transition: background 120ms ease-out, transform 100ms ease-out;
  }
  .g2048-tile.pop { animation: tilepop 150ms ease-out; }
  @keyframes tilepop { 0% { transform: scale(0.7);} 100% { transform: scale(1);} }
  .g2048-tile[data-v="2"] { background: #EEF2FF; color: #334155; }
  .g2048-tile[data-v="4"] { background: #E0E7FF; color: #334155; }
  .g2048-tile[data-v="8"] { background: #FDE68A; color: #78350F; }
  .g2048-tile[data-v="16"] { background: #FCA5A5; color: #7F1D1D; }
  .g2048-tile[data-v="32"] { background: #F87171; color: #fff; }
  .g2048-tile[data-v="64"] { background: #EF4444; color: #fff; }
  .g2048-tile[data-v="128"] { background: #FBBF24; color: #fff; font-size: 19px; }
  .g2048-tile[data-v="256"] { background: #F59E0B; color: #fff; font-size: 19px; }
  .g2048-tile[data-v="512"] { background: #10B981; color: #fff; font-size: 19px; }
  .g2048-tile[data-v="1024"] { background: #059669; color: #fff; font-size: 16px; }
  .g2048-tile[data-v="2048"] { background: var(--accent-purple); color: #fff; font-size: 16px; }

  /* ---------- Memory ---------- */
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 320px;
    margin: 0 auto;
  }
  .memory-card {
    aspect-ratio: 1;
    perspective: 600px;
    cursor: pointer;
  }
  .memory-card .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 300ms ease-out;
  }
  .memory-card.flipped .inner { transform: rotateY(180deg); }
  .memory-card .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    backface-visibility: hidden;
    font-size: 26px;
    border: 2px solid var(--color-border);
    box-shadow: var(--clay-shadow-sm);
  }
  .memory-card .face.back { background: var(--color-secondary); color: var(--color-on-primary); font-weight: 700; }
  .memory-card .face.front { background: var(--color-muted); transform: rotateY(180deg); }
  .memory-card.matched .face.front { background: #D1FAE5; }

  /* ---------- RPS ---------- */
  .rps-row { display: flex; justify-content: center; gap: 14px; margin: 6px 0 16px; }
  .rps-btn {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    font-size: 30px;
    border: 3px solid var(--color-border);
    background: var(--color-muted);
    box-shadow: var(--clay-shadow);
    cursor: pointer;
    transition: transform 120ms ease-out;
  }
  .rps-btn:hover { transform: translateY(-2px) scale(1.03); }
  .rps-btn:active { transform: scale(0.94); }
  .rps-result { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 44px; margin: 10px 0; min-height: 60px; }
  .rps-result .vs { font-size: 16px; font-weight: 700; opacity: 0.5; }
  .rps-shake { animation: shake 350ms ease-out; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

  /* ---------- Network Tools ---------- */
  .net-field { margin-bottom: 14px; }
  .net-field label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    opacity: 0.75;
  }
  .net-field input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 3px solid var(--color-border);
    background: var(--color-muted);
    color: var(--color-foreground);
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    box-shadow: var(--clay-shadow-pressed);
  }
  .net-field input[type="range"] {
    width: 100%;
    accent-color: var(--color-secondary);
  }
  .net-error {
    color: var(--color-destructive);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    min-height: 18px;
    margin: 4px 0;
  }
  .net-results {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 12px;
  }
  .net-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: var(--color-muted);
    border: 2px solid var(--color-border);
    border-radius: 12px;
    font-size: 13px;
  }
  .net-key { font-weight: 700; opacity: 0.7; white-space: nowrap; }
  .net-val {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    text-align: right;
    word-break: break-all;
  }
  .net-row.net-highlight { border-color: var(--accent-teal); }
  .net-table-wrap { overflow-x: auto; margin-top: 4px; }
  .net-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .net-table th, .net-table td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
  .net-table th { font-family: 'Fredoka', sans-serif; opacity: 0.8; }
  .net-card-gap { margin-top: 16px; }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 420px) {
    .card { padding: 16px; }
    #display { font-size: 26px; }
    button.key { height: 50px; font-size: 17px; }
    .ttt-grid, .g2048-board { max-width: 240px; width: 240px; }
    .memory-grid { max-width: 280px; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app">
  <div class="header-sticky">
    <div class="topbar">
      <div class="brand"><span class="logo">🎉</span><span>Fun Hub</span></div>
      <div class="controls">
        <button class="icon-btn" id="soundToggle" data-muted="false" aria-label="Toggle sound">
          <svg class="icon-loud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          <svg class="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="calc">🧮 Calculator</button>
      <button class="tab" data-tab="network">🌐 Network</button>
      <button class="tab" data-tab="ttt">❌ Tic-Tac-Toe</button>
      <button class="tab" data-tab="snake">🐍 Snake</button>
      <button class="tab" data-tab="g2048">🔢 2048</button>
      <button class="tab" data-tab="memory">🧠 Memory</button>
      <button class="tab" data-tab="rps">✊ RPS</button>
    </nav>
  </div>

  <main class="app-grid">
    <!-- ===================== CALCULATOR ===================== -->
    <section class="tabpanel" id="tab-calc">
      <div class="card">
        <div class="card__header">
          <p class="card__title">Calculator</p>
        </div>
        <div class="history" id="history">&nbsp;</div>
        <input type="text" id="display" disabled aria-label="Calculator display" value="0">
        <div class="buttons">
          <button class="key clear" onclick="Calc.clear()" aria-label="Clear">C</button>
          <button class="key" onclick="Calc.del()" aria-label="Backspace">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a1 1 0 001-1V5a1 1 0 00-1-1z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
          </button>
          <button class="key operator" onclick="Calc.append('%')" aria-label="Percent">%</button>
          <button class="key operator" onclick="Calc.append('/')" aria-label="Divide">÷</button>

          <button class="key" onclick="Calc.append('7')">7</button>

<script>
/* ============================================================
   SHARED UTILITIES: storage, theme, sound, confetti, tabs
   ============================================================ */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

const Store = {
  get(key, fallback) {
    const v = localStorage.getItem(key);
    if (v === null) return fallback;
    try { return JSON.parse(v); } catch { return fallback; }
  },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
};

/* ---- Theme ---- */
const themeToggle = $('#themeToggle');
const storedTheme = localStorage.getItem('fh-theme');
if (storedTheme) document.documentElement.setAttribute('data-theme', storedTheme);
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme')
    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('fh-theme', next);
});

/* ---- Sound (Web Audio, synthesized — no external files) ---- */
const Sound = (() => {
  let ctx = null;
  let muted = Store.get('fh-muted', false);
  const btn = $('#soundToggle');
  btn.dataset.muted = String(muted);
  function ensureCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0) {
    if (muted) return;
    const c = ensureCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + dur + 0.02);
  }
  btn.addEventListener('click', () => {
    muted = !muted;
    btn.dataset.muted = String(muted);
    Store.set('fh-muted', muted);
    if (!muted) tone(440, 0.08);
  });
  return {
    click: () => tone(520, 0.05, 'square', 0.08),
    pop: () => tone(700, 0.06, 'triangle', 0.1),
    win: () => { tone(523, 0.12, 'sine', 0.15); tone(659, 0.12, 'sine', 0.15, 0.12); tone(784, 0.18, 'sine', 0.15, 0.24); },
    lose: () => { tone(300, 0.15, 'sawtooth', 0.1); tone(200, 0.25, 'sawtooth', 0.1, 0.15); },
    move: () => tone(380, 0.04, 'square', 0.06),
    eat: () => tone(880, 0.08, 'triangle', 0.12),
  };
})();

/* ---- Confetti ---- */
const Confetti = (() => {
  const canvas = $('#confetti-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let raf = null;
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  const colors = ['#2563EB', '#059669', '#DC2626', '#EA580C', '#7C3AED', '#DB2777', '#0D9488'];
  function burst(cx, cy, count = 90) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.3,
        life: 60 + Math.random() * 40,
      });
    }
    if (!raf) tick();
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vrot; p.life--;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 40);
    if (particles.length) raf = requestAnimationFrame(tick);
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  function fromCenter() { burst(window.innerWidth / 2, window.innerHeight / 3); }
  return { burst, fromCenter };
})();

/* ---- Quick-jump nav (all apps live on one page now) ---- */

    const id = entry.target.id.replace('tab-', '');
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === id));

panels.forEach(p => sectionObserver.observe(p));

// Keyboard shortcuts (digits for Calculator, arrows for Snake/2048) only apply
// to whichever of those panels the pointer is over or was last interacted with.
['calc', 'snake', 'g2048'].forEach(id => {

/* ============================================================
   CALCULATOR
   ============================================================ */
const Calc = (() => {
  const display = $('#display');
  const history = $('#history');
  const funNumbers = [42, 69, 100, 420, 1337, 8008, 3.14159];
  function append(value) {
    Sound.click();
    if (display.value === '0' && /[0-9]/.test(value)) display.value = value;
    else if (display.value === 'Error') display.value = value;
    else display.value += value;
  }
  function clear() {
    Sound.click();
    display.value = '0';
    history.innerHTML = '&nbsp;';
  }
  function del() {
    Sound.click();
    display.value = display.value.slice(0, -1) || '0';
  }
  function calculate() {
    const expression = display.value;
    try {
      const result = Function('"use strict"; return (' + expression + ')')();
      history.textContent = expression + ' =';
      if (Number.isFinite(result)) {
        display.value = String(result);
        Sound.pop();
        if (funNumbers.includes(Math.abs(result))) {
          Confetti.fromCenter();
          Sound.win();
        }
      } else {
        display.value = 'Error';
        Sound.lose();
      }
    } catch {
      display.value = 'Error';
      Sound.lose();
    }
    display.classList.remove('pop');
    void display.offsetWidth;
    display.classList.add('pop');
  }
  document.addEventListener('keydown', (e) => {
    if (activeTab !== 'calc') return;
    if (/[0-9+\-*/.%]/.test(e.key)) append(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
    else if (e.key === 'Backspace') del();
    else if (e.key === 'Escape') clear();
  });
  return { append, clear, del, calculate };
})();

/* ============================================================
   NETWORK TOOLS — IPv4 subnet calculator
   ============================================================ */
const Net = (() => {
  const ipInput = $('#net-ip');
  const maskInput = $('#net-mask');
  const cidrSlider = $('#net-cidr');
  const cidrLabel = $('#net-cidr-label');
  const cidrField = $('#net-cidr-field');
  const maskField = $('#net-mask-field');
  const errorEl = $('#net-error');
  const resultsEl = $('#net-results');
  const modeRow = $('#net-mode-row');
  let mode = 'cidr';

  function isValidIp(ip) {
    const parts = ip.trim().split('.');
    if (parts.length !== 4) return false;
    return parts.every(p => /^\d{1,3}$/.test(p) && Number(p) >= 0 && Number(p) <= 255);
  }

  function ipToInt(ip) {
    return ip.trim().split('.').reduce((acc, oct) => (acc << 8) + Number(oct), 0) >>> 0;
  }

  function intToIp(int) {
    return [(int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255].join('.');
  }

  function cidrToMaskInt(cidr) {
    return cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
  }

  function maskIntToCidr(maskInt) {
    let count = 0;
    for (let i = 31; i >= 0; i--) {
      if ((maskInt >>> i) & 1) count++; else break;
    }
    return count;
  }

  function isValidMaskInt(maskInt) {
    let seenZero = false;
    for (let i = 31; i >= 0; i--) {
      const bit = (maskInt >>> i) & 1;
      if (bit === 0) seenZero = true;
      else if (seenZero) return false;
    }
    return true;
  }

  function toBinaryOctets(int) {
    return [(int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255]
      .map(o => o.toString(2).padStart(8, '0')).join('.');
  }

  function classify(ipInt) {
    const a = (ipInt >>> 24) & 255;
    const b = (ipInt >>> 16) & 255;
    let cls;
    if (a === 127) cls = 'A (loopback)';
    else if (a >= 1 && a <= 126) cls = 'A';
    else if (a >= 128 && a <= 191) cls = 'B';
    else if (a >= 192 && a <= 223) cls = 'C';
    else if (a >= 224 && a <= 239) cls = 'D (Multicast)';
    else cls = 'E (Reserved)';

    let type = 'Public';
    if (a === 10) type = 'Private';
    else if (a === 172 && b >= 16 && b <= 31) type = 'Private';
    else if (a === 192 && b === 168) type = 'Private';
    else if (a === 169 && b === 254) type = 'Link-Local (APIPA)';
    else if (a === 127) type = 'Loopback';
    else if (a >= 224 && a <= 239) type = 'Multicast';
    else if (a >= 240) type = 'Reserved';
    return { cls, type };
  }

  function setMode(m) {
    mode = m;
    Sound.click();
    $$('.pill', modeRow).forEach(p => p.classList.toggle('active', p.dataset.mode === m));
    cidrField.style.display = m === 'cidr' ? '' : 'none';
    maskField.style.display = m === 'mask' ? '' : 'none';
    calculate();
  }

  function calculate() {
    errorEl.textContent = '';
    const ip = ipInput.value.trim();
    if (!isValidIp(ip)) {
      resultsEl.innerHTML = '';
      errorEl.textContent = 'Enter a valid IPv4 address (e.g. 192.168.1.10).';
      return;
    }
    const ipInt = ipToInt(ip);

    let cidr, maskInt;
    if (mode === 'cidr') {
      cidr = Number(cidrSlider.value);
      maskInt = cidrToMaskInt(cidr);
    } else {
      const m = maskInput.value.trim();
      if (!isValidIp(m)) {
        resultsEl.innerHTML = '';
        errorEl.textContent = 'Enter a valid subnet mask (e.g. 255.255.255.0).';
        return;
      }
      maskInt = ipToInt(m);
      if (!isValidMaskInt(maskInt)) {
        resultsEl.innerHTML = '';
        errorEl.textContent = 'That subnet mask is not a valid contiguous mask.';
        return;
      }
      cidr = maskIntToCidr(maskInt);
    }

    const networkInt = (ipInt & maskInt) >>> 0;
    const wildcardInt = (~maskInt) >>> 0;
    const broadcastInt = (networkInt | wildcardInt) >>> 0;
    const totalAddresses = Math.pow(2, 32 - cidr);
    let usable, firstHost, lastHost;
    if (cidr === 32) {
      usable = 1; firstHost = intToIp(ipInt); lastHost = intToIp(ipInt);
    } else if (cidr === 31) {
      usable = 2; firstHost = intToIp(networkInt); lastHost = intToIp(broadcastInt);
    } else {
      usable = totalAddresses - 2;
      firstHost = intToIp(networkInt + 1);
      lastHost = intToIp(broadcastInt - 1);
    }

    const { cls, type } = classify(ipInt);

    const rows = [
      ['CIDR Notation', ip + '/' + cidr, true],
      ['Subnet Mask', intToIp(maskInt)],
      ['Wildcard Mask', intToIp(wildcardInt)],
      ['Network Address', intToIp(networkInt), true],
      ['Broadcast Address', intToIp(broadcastInt), true],
      ['Total Addresses', totalAddresses.toLocaleString()],
      ['Usable Hosts', usable.toLocaleString()],
      ['First Usable Host', firstHost],
      ['Last Usable Host', lastHost],
      ['IP Class', cls],
      ['Address Type', type],
      ['Binary IP', toBinaryOctets(ipInt)],
      ['Binary Mask', toBinaryOctets(maskInt)],
    ];

    resultsEl.innerHTML = rows.map(([k, v, hi]) =>
      `<div class="net-row${hi ? ' net-highlight' : ''}"><span class="net-key">${k}</span><span class="net-val">${v}</span></div>`
    ).join('');
    Sound.pop();
  }

  function randomize() {
    const oct = () => Math.floor(Math.random() * 255) + 1;
    ipInput.value = [oct(), oct(), oct(), oct()].join('.');
    if (mode === 'cidr') {
      const presets = [8, 16, 24, 25, 26, 27, 28, 30];
      const cidr = presets[Math.floor(Math.random() * presets.length)];
      cidrSlider.value = cidr;
      cidrLabel.textContent = '/' + cidr;
    }
    calculate();
  }

  function buildRefTable() {
    const rows = [];
    for (let c = 32; c >= 16; c--) {
      const maskInt = cidrToMaskInt(c);
      const hosts = c === 32 ? 1 : c === 31 ? 2 : Math.pow(2, 32 - c) - 2;
      rows.push(`<tr><td>/${c}</td><td>${intToIp(maskInt)}</td><td>${hosts.toLocaleString()}</td></tr>`);
    }
    $('#net-ref-table').innerHTML =
      '<tr><th>CIDR</th><th>Subnet Mask</th><th>Usable Hosts</th></tr>' + rows.join('');
  }

  cidrSlider.addEventListener('input', () => {
    cidrLabel.textContent = '/' + cidrSlider.value;
    calculate();
  });
  [ipInput, maskInput].forEach(el => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
  });

  buildRefTable();
  calculate();
  return { setMode, calculate, randomize };
})();

  let board = Array(9).fill(null);

  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function render() {

    $('#ttt-x').textContent = scores.x;
    $('#ttt-o').textContent = scores.o;
    $('#ttt-d').textContent = scores.d;
  }

  function checkWinner(b) {
    for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    if (b.every(Boolean)) return 'draw';
    return null;
  }

  function minimax(b, player) {
    const winner = checkWinner(b);
    if (winner === 'O') return { score: 10 };
    if (winner === 'X') return { score: -10 };
    if (winner === 'draw') return { score: 0 };
    const moves = [];
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        const nb = b.slice();
        nb[i] = player;
        const res = minimax(nb, player === 'O' ? 'X' : 'O');
        moves.push({ index: i, score: res.score });
      }
    }
    return player === 'O'
      ? moves.reduce((a, m) => m.score > a.score ? m : a)
      : moves.reduce((a, m) => m.score < a.score ? m : a);
  }

  function finish(winner) {
    over = true;
    if (winner === 'draw') {
      statusEl.textContent = "It's a draw!";
      scores.d++;
    } else {
      statusEl.textContent = winner + ' wins!';
      scores[winner.toLowerCase()]++;
      Confetti.fromCenter();
      Sound.win();
    }
    Store.set('ttt-scores', scores);
    render();
  }

  function onCellClick(i) {
    if (over || thinking || board[i]) return;
    Sound.click();
    board[i] = current;
    const winner = checkWinner(board);
    if (winner) { finish(winner); return; }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = current + "'s turn";
    if (!over && mode !== 'pvp' && current === 'O') {
      thinking = true;
      render();
      setTimeout(cpuMove, 350);
    } else {
      render();
    }
  }

  function cpuMove() {
    if (over) return;
    thinking = false;
    const empties = board.map((v, i) => v ? null : i).filter(v => v !== null);
    let idx;
    if (mode === 'easy') {
      idx = empties[Math.floor(Math.random() * empties.length)];
    } else {
      idx = minimax(board, 'O').index;
    }
    board[idx] = 'O';
    Sound.pop();
    const winner = checkWinner(board);
    if (winner) { finish(winner); return; }
    current = 'X';
    statusEl.textContent = "X's turn";
    render();
  }

  function reset() {
    board = Array(9).fill(null);
    current = 'X';
    over = false;
    thinking = false;
    statusEl.textContent = "X's turn";
    render();
  }

  function setMode(m) {
    mode = m;
    $$('.pill', gridEl.parentElement).forEach(p => p.classList.toggle('active', p.dataset.mode === m));
    reset();
  }

  function resetScores() {
    scores = { x: 0, o: 0, d: 0 };
    Store.set('ttt-scores', scores);
    render();
  }

  render();
  return { setMode, reset, resetScores };
})();

/* ============================================================
   SNAKE
   ============================================================ */
const Snake = (() => {
  const canvas = $('#snakeCanvas');
  const ctx = canvas.getContext('2d');
  const GRID = 16, CELL = 20;
  let snake, dir, nextDir, food, score, best, timer, running, speed;
  const scoreEl = $('#snake-score');
  const bestEl = $('#snake-best');
  const startBtn = $('#snake-startbtn');
  best = Store.get('snake-best', 0);
  bestEl.textContent = best;

  function styleVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function randomFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function init() {
    snake = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 140;
    food = randomFood();
    scoreEl.textContent = 0;
    running = false;
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = styleVar('--color-muted') || '#F1F3F5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = styleVar('--color-secondary') || '#2563EB';
    snake.forEach((s, i) => {
      ctx.globalAlpha = i === 0 ? 1 : 0.85;
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.font = (CELL - 2) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍎', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
    if (!running && score === 0 && startBtn.textContent === 'Start') {
      ctx.fillStyle = styleVar('--color-foreground') || '#0F172A';
      ctx.font = '14px sans-serif';
      ctx.globalAlpha = 0.6;
      ctx.fillText('Press Start to play', canvas.width / 2, canvas.height / 2);
      ctx.globalAlpha = 1;
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      Sound.eat();
      food = randomFood();
      if (score % 5 === 0 && speed > 70) {
        speed -= 8;
        restartTimer();
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      Store.set('snake-best', best);
      bestEl.textContent = best;
      Confetti.fromCenter();
    }
    Sound.lose();
    ctx.fillStyle = 'rgba(15,23,42,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '14px sans-serif';
    ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 16);
    startBtn.textContent = 'Restart';
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function startOrRestart() {
    Sound.click();
    init();
    running = true;
    startBtn.textContent = 'Restart';
    restartTimer();
  }

  function setDir(x, y) {
    if (!running) return;
    if (dir.x === -x && dir.y === -y) return;
    if ((x !== 0 && dir.x !== 0) || (y !== 0 && dir.y !== 0)) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    if (activeTab !== 'snake') return;
    const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
    if (map[e.key]) { e.preventDefault(); setDir(...map[e.key]); }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => { touchStart = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  init();
  return { setDir, startOrRestart };
})();

/* ============================================================
   2048
   ============================================================ */
const G2048 = (() => {
  const boardEl = $('#g2048-board');
  const scoreEl = $('#g2048-score');
  const bestEl = $('#g2048-best');
  const statusEl = $('#g2048-status');
  let grid, score, best, won, over;
  best = Store.get('g2048-best', 0);
  bestEl.textContent = best;

  function emptyGrid() { return Array.from({ length: 4 }, () => Array(4).fill(0)); }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (grid[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function slide(row) {
    let arr = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        gained += arr[i];
        arr[i + 1] = 0;
      }
    }
    arr = arr.filter(v => v !== 0);
    while (arr.length < 4) arr.push(0);
    return { row: arr, gained };
  }

  function transpose(g) {
    return g[0].map((_, c) => g.map(row => row[c]));
  }

  function move(direction) {
    if (over) return;
    let working = grid.map(r => r.slice());
    let gained = 0;
    let transposed = false, reversed = false;

    if (direction === 'up' || direction === 'down') { working = transpose(working); transposed = true; }
    if (direction === 'right' || direction === 'down') { working = working.map(r => r.slice().reverse()); reversed = true; }

    const newRows = working.map(row => {
      const res = slide(row);
      gained += res.gained;
      return res.row;
    });

    let result = newRows;
    if (reversed) result = result.map(r => r.slice().reverse());
    if (transposed) result = transpose(result);

    const moved = JSON.stringify(result) !== JSON.stringify(grid);
    if (!moved) return;

    grid = result;
    score += gained;
    if (gained > 0) Sound.eat(); else Sound.move();
    addRandomTile();
    scoreEl.textContent = score;
    if (score > best) { best = score; Store.set('g2048-best', best); bestEl.textContent = best; }
    render(true);

    if (!won && grid.some(row => row.includes(2048))) {
      won = true;
      statusEl.textContent = '🎉 You reached 2048!';
      Confetti.fromCenter();
      Sound.win();
    } else if (isGameOver()) {
      over = true;
      statusEl.textContent = 'Game Over — no more moves';
      Sound.lose();
    }
  }

  function isGameOver() {
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) return false;
        if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
        if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
      }
    }
    return true;
  }

  function render(animate) {
    boardEl.innerHTML = '';
    grid.forEach(row => row.forEach(v => {
      const tile = document.createElement('div');
      tile.className = 'g2048-tile' + (animate && v ? ' pop' : '');
      if (v) { tile.dataset.v = v; tile.textContent = v; }
      boardEl.appendChild(tile);
    }));
  }

  function reset() {
    Sound.click();
    grid = emptyGrid();
    score = 0; won = false; over = false;
    scoreEl.textContent = 0;
    statusEl.textContent = ' ';
    addRandomTile();
    addRandomTile();
    render(false);
  }

  document.addEventListener('keydown', (e) => {
    if (activeTab !== 'g2048') return;
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  let touchStart = null;
  boardEl.addEventListener('touchstart', (e) => { touchStart = e.touches[0]; }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, { passive: true });

  reset();
  return { reset };
})();

/* ============================================================
   MEMORY MATCH
   ============================================================ */
const Memory = (() => {
  const gridEl = $('#memory-grid');
  const movesEl = $('#memory-moves');
  const bestEl = $('#memory-best');
  const EMOJI = ['🍎','🍋','🍇','🍓','🍒','🍉','🍑','🥝'];
  let cards, first, second, lock, matches, moves;
  let best = Store.get('memory-best', null);
  bestEl.textContent = best === null ? '–' : best;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function render() {
    gridEl.innerHTML = '';
    cards.forEach((emoji, i) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      card.dataset.i = i;
      card.innerHTML = `<div class="inner">
        <div class="face back">?</div>
        <div class="face front">${emoji}</div>
      </div>`;
      card.addEventListener('click', () => onFlip(i, card));
      gridEl.appendChild(card);
    });
  }

  function onFlip(i, el) {
    if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
    Sound.click();
    el.classList.add('flipped');
    if (!first) { first = { i, el }; return; }
    second = { i, el };
    moves++;
    movesEl.textContent = moves;
    lock = true;
    if (cards[first.i] === cards[second.i]) {
      first.el.classList.add('matched');
      second.el.classList.add('matched');
      matches++;
      Sound.pop();
      first = null; second = null; lock = false;
      if (matches === EMOJI.length) {
        Confetti.fromCenter();
        Sound.win();
        if (best === null || moves < best) {
          best = moves;
          Store.set('memory-best', best);
          bestEl.textContent = best;
        }
      }
    } else {
      setTimeout(() => {
        first.el.classList.remove('flipped');
        second.el.classList.remove('flipped');
        first = null; second = null; lock = false;
      }, 700);
    }
  }

  function reset() {
    Sound.click();
    cards = shuffle([...EMOJI, ...EMOJI]);
    first = null; second = null; lock = false; matches = 0; moves = 0;
    movesEl.textContent = 0;
    render();
  }

  reset();
  return { reset };
})();

/* ============================================================
   ROCK PAPER SCISSORS
   ============================================================ */
const RPS = (() => {
  const EMOJI = { rock: '🪨', paper: '📄', scissors: '✂️' };
  const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
  const youEl = $('#rps-you');
  const cpuEl = $('#rps-cpu');
  const statusEl = $('#rps-status');
  const resultEl = $('#rps-result');
  let score = Store.get('rps-score', { win: 0, lose: 0, tie: 0 });
  renderScore();

  function renderScore() {
    $('#rps-win').textContent = score.win;
    $('#rps-lose').textContent = score.lose;
    $('#rps-tie').textContent = score.tie;
  }

  function play(you) {
    Sound.click();
    const choices = Object.keys(EMOJI);
    const cpu = choices[Math.floor(Math.random() * choices.length)];
    youEl.textContent = EMOJI[you];
    cpuEl.textContent = EMOJI[cpu];
    let outcome;
    if (you === cpu) outcome = 'tie';
    else if (BEATS[you] === cpu) outcome = 'win';
    else outcome = 'lose';
    score[outcome]++;
    Store.set('rps-score', score);
    renderScore();
    resultEl.classList.remove('rps-shake');
    if (outcome === 'win') { statusEl.textContent = 'You win! 🎉'; Sound.win(); Confetti.fromCenter(); }
    else if (outcome === 'lose') { statusEl.textContent = 'Computer wins!'; Sound.lose(); void resultEl.offsetWidth; resultEl.classList.add('rps-shake'); }
    else { statusEl.textContent = "It's a tie!"; Sound.pop(); }
  }

  function resetScores() {
    score = { win: 0, lose: 0, tie: 0 };
    Store.set('rps-score', score);
    renderScore();
    statusEl.textContent = 'Make your move!';
    youEl.textContent = '❔';
    cpuEl.textContent = '❔';
  }

  return { play, resetScores };
})();
